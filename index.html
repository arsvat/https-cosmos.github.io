<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos VPN — Официальный сайт</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #050505; color: #fff;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px);
            background-size: 350px 350px, 200px 200px;
            z-index: -1; opacity: 0.4;
        }

        .lang-switch {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px; border-radius: 30px;
            cursor: pointer; transition: 0.3s; font-weight: bold; z-index: 10;
        }
        .lang-switch:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }

        .container { max-width: 1000px; width: 90%; text-align: center; padding: 60px 0 40px; }

        .logo-container {
            width: 180px; height: 180px; margin: 0 auto 25px;
            border-radius: 50%; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
        }

        .features { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; flex-wrap: wrap; }
        .feature-item { padding: 20px 30px; text-align: center; }
        .feature-item strong { display: block; font-size: 1.2rem; margin-bottom: 5px; }
        .feature-item span { color: #888; font-size: 0.9rem; }

        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 60px; }
        .card { padding: 45px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.07); }

        .price { font-size: 2.5rem; font-weight: 800; margin: 20px 0; letter-spacing: -1px; }

        /* Кнопка купить */
        .buy-btn {
            background: #fff; color: #000; border: none; padding: 12px;
            border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s; margin-top: auto; text-decoration: none;
        }
        .buy-btn:hover { background: #ccc; transform: scale(1.05); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); z-index: 1000;
            padding: 40px 0; overflow-y: auto;
        }
        .modal-content { 
            max-width: 850px; margin: 0 auto; line-height: 1.7; position: relative;
            padding: 40px; box-sizing: border-box; color: #ddd; text-align: left;
        }
        .modal-content h2 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .close-btn { position: absolute; top: 20px; right: 25px; cursor: pointer; font-size: 2.5rem; color: #fff; }footer { margin-top: auto; padding: 40px; text-align: center; width: 100%; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-links span { cursor: pointer; margin: 0 15px; color: #666; transition: 0.3s; font-size: 0.95rem; }
        .footer-links span:hover { color: #fff; }
        .support-link { color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="lang-switch" onclick="toggleLang()" id="langBtn">EN</div>

    <div class="container">
        <div class="logo-container">
            <img src="1000007216.jpg" alt="Cosmos VPN Logo">
        </div>
        <h1 id="mainTitle" style="font-size: 3rem; letter-spacing: 6px; text-transform: uppercase;">Cosmos VPN</h1>
        <p id="tagline" style="color: #aaa; margin-bottom: 50px; font-size: 1.1rem;"></p>

        <div class="features">
            <div class="feature-item glass">
                <strong id="featLocTitle"></strong>
                <span id="featLocSub"></span>
            </div>
            <div class="feature-item glass">
                <strong id="featSpeedTitle"></strong>
                <span id="featSpeedSub"></span>
            </div>
        </div>

        <div class="pricing-grid">
            <div class="card glass">
                <h3 id="plan1"></h3>
                <div class="price">150 ₽</div>
                <a href="https://t.me/arsvat2" class="buy-btn btnText">Купить</a>
            </div>
            <div class="card glass" style="border-color: rgba(255,255,255,0.3);">
                <h3 id="plan2"></h3>
                <div class="price">270 ₽</div>
                <a href="https://t.me/arsvat2" class="buy-btn btnText">Купить</a>
            </div>
            <div class="card glass">
                <h3 id="plan3"></h3>
                <div class="price">1200 ₽</div>
                <a href="https://t.me/arsvat2" class="buy-btn btnText">Купить</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <span onclick="openModal('oferta')" id="linkOferta"></span>
            <span onclick="openModal('privacy')" id="linkPrivacy"></span>
        </div>
        <p style="margin-top: 20px; color: #555;">
            <span id="supportText"></span>: <a href="https://t.me/arsvat2" class="support-link">@arsvat2</a>
        </p>
    </footer>

    <div id="oferta" class="modal">
        <div class="modal-content glass">
            <span class="close-btn" onclick="closeModal('oferta')">&times;</span>
            <div id="ofertaContent"></div>
        </div>
    </div>
    <div id="privacy" class="modal">
        <div class="modal-content glass">
            <span class="close-btn" onclick="closeModal('privacy')">&times;</span>
            <div id="privacyContent"></div>
        </div>
    </div>

    <script>
        let currentLang = 'ru';

        const translations = {
            ru: {
                btn: 'EN',
                tagline: 'Твой портал в свободный интернет',
                featLocTitle: 'Европа и Азия',
                featLocSub: 'Локации серверов',
                featSpeedTitle: 'до 1 Гбит/с',
                featSpeedSub: 'Скорость соединения',
                plan1: '1 Месяц',
                plan2: '3 Месяца',
                plan3: '1 Год',
                buyBtn: 'Купить',
                linkOferta: 'Публичная оферта',
                linkPrivacy: 'Политика конфиденциальности',
                supportText: 'Поддержка',
                ofertaContent: `
                    <h2>Публичная оферта сервиса Cosmos VPN</h2>
                    <p><strong>1. ВВЕДЕНИЕ И ТЕРМИНЫ</strong><br>Настоящая оферта является официальным предложением администрации Cosmos VPN (далее — Исполнитель) заключить Договор об оказании услуг по предоставлению доступа к сети частных серверов. Использование сервиса подразумевает полное согласие с условиями данного документа.</p><p><strong>2. ПРЕДМЕТ ДОГОВОРА</strong><br>Исполнитель обязуется предоставить Пользователю техническую возможность туннелирования интернет-трафика через серверное оборудование в регионах Европа и Азия, а Пользователь обязуется оплатить данные услуги согласно выбранному тарифу.</p>
                    <p><strong>3. ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ</strong><br>Доступ осуществляется с использованием передовых криптографических технологий (VLESS, ShadowSocks, Trojan). Скорость канала может достигать 1 Гбит/с, однако Исполнитель не несет ответственности за ограничения, накладываемые локальными провайдерами связи Пользователя.</p>
                    <p><strong>4. ПРАВА И ОБЯЗАННОСТИ СТОРОН</strong><br>Исполнитель имеет право проводить профилактические работы на серверах. Пользователь обязуется использовать сервис исключительно в легальных целях. Запрещена любая деятельность, связанная с нарушением авторских прав, массовой рассылкой сообщений (спам), или совершением кибератак.</p>
                    <p><strong>5. ПОРЯДОК ОПЛАТЫ И ВОЗВРАТОВ</strong><br>Услуги предоставляются по модели предоплаты. В связи с природой цифрового товара, возврат средств возможен только в течение 24 часов с момента первой покупки при условии документально подтвержденной технической невозможности использования сервиса на стороне Исполнителя.</p>
                    <p><strong>6. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ</strong><br>Исполнитель оставляет за собой право изменять текст оферты. Актуальная версия доступна по адресу сайта проекта. Все споры решаются путем переговоров через официальные каналы поддержки.</p>
                ,
                privacyContent: 
                    <h2>Политика конфиденциальности Cosmos VPN</h2>
                    <p><strong>1. ПРИНЦИП "ZERO LOGS"</strong><br>Безопасность Пользователя является нашим приоритетом. Мы придерживаемся политики полного отсутствия ведения журналов активности (логов). Мы НЕ собираем и НЕ храним:<br>- Историю посещенных веб-ресурсов;<br>- Реальные IP-адреса Пользователей;<br>- Данные о временных метках подключений;<br>- Метаданные трафика.</p>
                    <p><strong>2. RAM-ONLY ИНФРАСТРУКТУРА</strong><br>Все наши серверы в Азии и Европе функционируют исключительно в оперативной памяти (RAM). Это означает, что никакие данные не записываются на жесткие диски, и вся временная системная информация уничтожается физически при каждой плановой или экстренной перезагрузке оборудования.</p>
                    <p><strong>3. ОБРАБОТКА МИНИМАЛЬНЫХ ДАННЫХ</strong><br>Для функционирования подписки мы сохраняем только идентификатор транзакции и дату окончания доступа. Эта информация надежно зашифрована и не связана с персональной личностью Пользователя.</p>
                    <p><strong>4. ЗАЩИТА ОТ ТРЕТЬИХ ЛИЦ</strong><br>Мы не передаем никакую информацию маркетинговым агентствам или государственным структурам. Ввиду отсутствия логов, мы не обладаем данными, которые могли бы идентифицировать конкретного Пользователя даже при официальном запросе.</p>
                    <p><strong>5. ИСПОЛЬЗУЕМЫЕ ТЕХНОЛОГИИ</strong><br>Весь трафик шифруется по стандарту AES-256-GCM или ChaCha20-Poly1305, что исключает возможность перехвата данных на уровне интернет-провайдера или злоумышленников в публичных Wi-Fi сетях.</p>
                `
            },
            en: {
                btn: 'RU',
                tagline: 'Your portal to the free internet',
                featLocTitle: 'Europe & Asia',
                featLocSub: 'Server locations',
                featSpeedTitle: 'up to 1 Gbps',
                featSpeedSub: 'Connection speed',
                plan1: '1 Month',
                plan2: '3 Months',
                plan3: '1 Year',
                buyBtn: 'Buy Now',
                linkOferta: 'Terms of Service',linkPrivacy: 'Privacy Policy',
                supportText: 'Support',
                ofertaContent: 
                    <h2>Public Offer — Cosmos VPN</h2>
                    <p><strong>1. AGREEMENT SUBJECT</strong><br>Cosmos VPN provides virtual private network services. By subscribing, you agree to comply with all terms stated herein.</p>
                    <p><strong>2. TECHNOLOGY & PERFORMANCE</strong><br>We provide high-speed access (up to 1Gbps) using VLESS and Reality protocols. Service availability is maintained at 99.9% uptime.</p>
                    <p><strong>3. RESTRICTIONS</strong><br>Spam, DDoS, and copyright infringement are strictly prohibited. Violations lead to immediate termination without refund.</p>
                ,
                privacyContent: 
                    <h2>Privacy Policy</h2>
                    <p><strong>1. STRICT NO-LOGS POLICY</strong><br>We do not store browsing history, IP addresses, or timestamps. Your activity remains private and invisible to everyone, including us.</p>
                    <p><strong>2. RAM-ONLY NODES</strong><br>Our infrastructure runs entirely on RAM, meaning all temporary system data is wiped upon reboot.</p>
                
            }
        };

        function updateContent() {
            const t = translations[currentLang];
            document.getElementById('langBtn').innerText = t.btn;
            document.getElementById('tagline').innerText = t.tagline;
            document.getElementById('featLocTitle').innerText = t.featLocTitle;
            document.getElementById('featLocSub').innerText = t.featLocSub;
            document.getElementById('featSpeedTitle').innerText = t.featSpeedTitle;
            document.getElementById('featSpeedSub').innerText = t.featSpeedSub;
            document.getElementById('plan1').innerText = t.plan1;
            document.getElementById('plan2').innerText = t.plan2;
            document.getElementById('plan3').innerText = t.plan3;
            document.getElementById('linkOferta').innerText = t.linkOferta;
            document.getElementById('linkPrivacy').innerText = t.linkPrivacy;
            document.getElementById('supportText').innerText = t.supportText;
            document.getElementById('ofertaContent').innerHTML = t.ofertaContent;
            document.getElementById('privacyContent').innerHTML = t.privacyContent;
            
            document.querySelectorAll('.btnText').forEach(btn => btn.innerText = t.buyBtn);
        }

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            updateContent();
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target.className === 'modal') { closeModal(event.target.id); }
        }

        updateContent();
    </script>
</body>
</html>
