<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos VPN — Скорость и Приватность</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #050505; color: #fff;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* Звездный фон */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px);
            background-size: 350px 350px, 200px 200px;
            z-index: -1; opacity: 0.4;
        }

        /* Кнопка смены языка */
        .lang-switch {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 20px; border-radius: 30px;
            cursor: pointer; transition: 0.3s; font-weight: bold;
            z-index: 10;
        }
        .lang-switch:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }

        .container { max-width: 1000px; width: 90%; text-align: center; padding: 80px 0 40px; }

        /* Иконка Черной Дыры */
        .black-hole {
            width: 110px; height: 110px; background: #000; border-radius: 50%;
            margin: 0 auto 25px; position: relative;
            box-shadow: 0 0 35px 8px rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Эффект Жидкого Стекла */
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .features { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; flex-wrap: wrap; }
        .feature-item { padding: 20px 30px; text-align: center; }
        .feature-item strong { display: block; font-size: 1.2rem; margin-bottom: 5px; }
        .feature-item span { color: #888; font-size: 0.9rem; }

        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 60px; }
        .card { padding: 45px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.07); }

        .price { font-size: 2.5rem; font-weight: 800; margin: 20px 0; letter-spacing: -1px; }

        /* Модальные окна */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); z-index: 1000;
            padding: 40px 0; overflow-y: auto;
        }
        .modal-content { 
            max-width: 850px; margin: 0 auto; line-height: 1.7; position: relative;
            padding: 40px; box-sizing: border-box; color: #ddd;
        }
        .modal-content h2 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .close-btn { position: absolute; top: 20px; right: 25px; cursor: pointer; font-size: 2.5rem; color: #fff; }

        footer { margin-top: auto; padding: 40px; text-align: center; width: 100%; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.05); }.footer-links span { cursor: pointer; margin: 0 15px; color: #666; transition: 0.3s; font-size: 0.95rem; }
        .footer-links span:hover { color: #fff; }
        .support-link { color: #fff; text-decoration: none; font-weight: 600; border-bottom: 1px solid transparent; transition: 0.3s; }
        .support-link:hover { border-bottom-color: #fff; }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="lang-switch" onclick="toggleLang()" id="langBtn">EN</div>

    <div class="container">
        <div class="black-hole"></div>
        <h1 id="mainTitle" style="font-size: 3rem; letter-spacing: 6px; text-transform: uppercase;">Cosmos VPN</h1>
        <p id="tagline" style="color: #aaa; margin-bottom: 50px; font-size: 1.1rem;"></p>

        <div class="features">
            <div class="feature-item glass">
                <strong id="featLocTitle"></strong>
                <span id="featLocSub"></span>
            </div>
            <div class="feature-item glass">
                <strong id="featSpeedTitle"></strong>
                <span id="featSpeedSub"></span>
            </div>
        </div>

        <div class="pricing-grid">
            <div class="card glass">
                <h3 id="plan1"></h3>
                <div class="price">150 ₽</div>
            </div>
            <div class="card glass" style="border-color: rgba(255,255,255,0.25);">
                <h3 id="plan2"></h3>
                <div class="price">270 ₽</div>
            </div>
            <div class="card glass">
                <h3 id="plan3"></h3>
                <div class="price">1200 ₽</div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <span onclick="openModal('oferta')" id="linkOferta"></span>
            <span onclick="openModal('privacy')" id="linkPrivacy"></span>
        </div>
        <p style="margin-top: 20px; color: #555;">
            <span id="supportText"></span>: <a href="https://t.me/arsvat2" class="support-link">@arsvat2</a>
        </p>
    </footer>

    <div id="oferta" class="modal">
        <div class="modal-content glass">
            <span class="close-btn" onclick="closeModal('oferta')">&times;</span>
            <div id="ofertaContent"></div>
        </div>
    </div>
    <div id="privacy" class="modal">
        <div class="modal-content glass">
            <span class="close-btn" onclick="closeModal('privacy')">&times;</span>
            <div id="privacyContent"></div>
        </div>
    </div>

    <script>
        let currentLang = 'ru';

        const translations = {
            ru: {
                btn: 'EN',
                tagline: 'Твой портал в свободный интернет',
                featLocTitle: 'Европа и Азия',
                featLocSub: 'Локации серверов',
                featSpeedTitle: 'до 1 Гбит/с',
                featSpeedSub: 'Скорость соединения',
                plan1: '1 Месяц',
                plan2: '3 Месяца',
                plan3: '1 Год',
                linkOferta: 'Публичная оферта',
                linkPrivacy: 'Политика конфиденциальности',
                supportText: 'Поддержка',
                ofertaText: `
                    <h2>Публичная оферта Cosmos VPN</h2>
                    <p><strong>1. Предмет соглашения</strong><br>Cosmos VPN предоставляет услуги доступа к защищенным серверам. Используя сайт, вы подтверждаете свое совершеннолетие и дееспособность.</p>
                    <p><strong>2. Порядок предоставления услуг</strong><br>Доступ предоставляется после 100% предоплаты. Мы обеспечиваем стабильное подключение в регионах Европа и Азия. При технических работах аптайм может временно снижаться, о чем мы стараемся уведомлять в поддержке.</p>
                    <p><strong>3. Стоимость и возврат</strong><br>Тарифы: 150/270/1200 рублей. Возврат средств возможен в течение 24 часов после покупки, если сервис технически не заработал на вашем устройстве.</p><p><strong>4. Запрещенные действия</strong><br>Запрещено использовать VPN для хакерских атак, распространения детской порнографии, спама и нарушения законов страны пребывания. При выявлении нарушений аккаунт блокируется без возврата средств.</p>
                    <p><strong>5. Изменение условий</strong><br>Мы вправе менять цены и условия оферты. Актуальная версия всегда находится на этой странице.</p>
                ,
                privacyText: 
                    <h2>Политика конфиденциальности</h2>
                    <p><strong>1. Политика No-Logs</strong><br>Мы принципиально не собираем логи ваших действий. Мы не знаем, на какие сайты вы заходите и какие данные передаете. Это технически невозможно в нашей архитектуре.</p>
                    <p><strong>2. Хранение данных</strong><br>Мы храним только минимально необходимую информацию: ваш ID пользователя и срок действия подписки. Мы не храним ваши IP-адреса после завершения сессии.</p>
                    <p><strong>3. RAM-серверы</strong><br>Наши серверы в Европе и Азии работают исключительно на оперативной памяти. При перезагрузке сервера любая временная системная информация уничтожается физически.</p>
                    <p><strong>4. Передача данных</strong><br>Поскольку мы не храним персональные данные, мы не можем передать их третьим лицам или государственным органам.</p>
                    <p><strong>5. Шифрование</strong><br>Для защиты трафика используется стандарт AES-256, обеспечивающий максимальную безопасность в открытых сетях.</p>
                
            },
            en: {
                btn: 'RU',
                tagline: 'Your portal to the free internet',
                featLocTitle: 'Europe & Asia',
                featLocSub: 'Server locations',
                featSpeedTitle: 'up to 1 Gbps',
                featSpeedSub: 'Connection speed',
                plan1: '1 Month',
                plan2: '3 Months',
                plan3: '1 Year',
                linkOferta: 'Public Offer',
                linkPrivacy: 'Privacy Policy',
                supportText: 'Support',
                ofertaText: 
                    <h2>Public Offer — Cosmos VPN</h2>
                    <p><strong>1. Subject of Agreement</strong><br>Cosmos VPN provides access to secure servers. By using the website, you confirm you are of legal age.</p>
                    <p><strong>2. Service Provision</strong><br>Access is provided after 100% prepayment. We guarantee stable connections in Europe and Asia. Uptime may temporarily decrease during maintenance.</p>
                    <p><strong>3. Cost & Refunds</strong><br>Plans: 150/270/1200 RUB. Refunds are possible within 24 hours if the service is technically non-functional on your device.</p>
                    <p><strong>4. Prohibited Actions</strong><br>VPN usage for hacking, spam, child pornography, or any illegal activities is strictly forbidden. Accounts will be banned without refunds for violations.</p>
                    <p><strong>5. Terms Changes</strong><br>We reserve the right to change prices and terms. The latest version is always available here.</p>
                ,
                privacyText: 
                    <h2>Privacy Policy</h2>
                    <p><strong>1. No-Logs Policy</strong><br>We strictly do not collect logs of your activities. We do not know which websites you visit or what data you transfer. Our architecture makes it impossible.</p>
                    <p><strong>2. Data Storage</strong><br>We only store minimum necessary info: your User ID and subscription expiry date. We do not store your IP addresses after a session ends.</p>
                    <p><strong>3. RAM-only Servers</strong><br>Our servers in Europe and Asia run on RAM only. All temporary system data is physically destroyed upon reboot.</p><p><strong>4. Data Disclosure</strong><br>Since we do not store personal data, we cannot disclose it to third parties or authorities.</p>
                    <p><strong>5. Encryption</strong><br>Traffic is protected by AES-256 standard, ensuring maximum security in public networks.</p>
                `
            }
        };

        function updateContent() {
            const t = translations[currentLang];
            document.getElementById('langBtn').innerText = t.btn;
            document.getElementById('tagline').innerText = t.tagline;
            document.getElementById('featLocTitle').innerText = t.featLocTitle;
            document.getElementById('featLocSub').innerText = t.featLocSub;
            document.getElementById('featSpeedTitle').innerText = t.featSpeedTitle;
            document.getElementById('featSpeedSub').innerText = t.featSpeedSub;
            document.getElementById('plan1').innerText = t.plan1;
            document.getElementById('plan2').innerText = t.plan2;
            document.getElementById('plan3').innerText = t.plan3;
            document.getElementById('linkOferta').innerText = t.linkOferta;
            document.getElementById('linkPrivacy').innerText = t.linkPrivacy;
            document.getElementById('supportText').innerText = t.supportText;
            document.getElementById('ofertaContent').innerHTML = t.ofertaText;
            document.getElementById('privacyContent').innerHTML = t.privacyText;
        }

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            updateContent();
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target.className === 'modal') { closeModal(event.target.id); }
        }

        updateContent();
    </script>
</body>
</html>
