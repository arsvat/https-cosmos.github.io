<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos VPN</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #050505; color: #fff;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        /* Звездный фон */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            background-image: radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 40px);
            background-size: 250px 250px; z-index: -1; opacity: 0.4;
        }

        /* Переключатель языка */
        .lang-switch {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 15px; border-radius: 20px;
            cursor: pointer; transition: 0.3s;
        }
        .lang-switch:hover { background: rgba(255,255,255,0.2); }

        .container { max-width: 1000px; width: 90%; text-align: center; padding: 60px 0; }

        /* Иконка Черной Дыры */
        .black-hole {
            width: 100px; height: 100px; background: #000; border-radius: 50%;
            margin: 0 auto 20px; position: relative;
            box-shadow: 0 0 30px 5px rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Жидкое стекло для карточек и плашек */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .features { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .feature-item { padding: 15px 20px; }

        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .card { padding: 40px; transition: 0.4s; }
        .card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.4); }

        .price { font-size: 2.2rem; font-weight: bold; margin: 15px 0; }

        /* Модальные окна */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 1000;
            padding: 40px 20px; overflow-y: auto;
        }
        .modal-content { max-width: 800px; margin: 0 auto; line-height: 1.6; }
        .close-btn { float: right; cursor: pointer; font-size: 2rem; }

        footer { margin-top: auto; padding: 30px; text-align: center; width: 100%; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-links span { cursor: pointer; margin: 0 15px; color: #888; transition: 0.3s; }
        .footer-links span:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="lang-switch" onclick="toggleLang()" id="langBtn">EN</div>

    <div class="container">
        <div class="black-hole"></div>
        <h1 id="mainTitle">Cosmos VPN</h1>
        <p id="tagline" style="color: #888; margin-bottom: 40px;">Твой портал в свободный интернет</p>

        <div class="features">
            <div class="feature-item glass">
                <strong id="featLocTitle">Европа и Азия</strong>
                <span id="featLocSub">Локации серверов</span>
            </div>
            <div class="feature-item glass">
                <strong id="featSpeedTitle">до 1 Гбит/с</strong>
                <span id="featSpeedSub">Скорость соединения</span>
            </div>
        </div>

        <div class="pricing-grid">
            <div class="card glass">
                <h3 id="plan1">1 Месяц</h3>
                <div class="price">150 ₽</div>
            </div>
            <div class="card glass" style="border-color: rgba(255,255,255,0.3);">
                <h3 id="plan2">3 Месяца</h3>
                <div class="price">270 ₽</div>
            </div>
            <div class="card glass">
                <h3 id="plan3">1 Год</h3>
                <div class="price">1200 ₽</div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <span onclick="openModal('oferta')" id="linkOferta">Оферта</span>
            <span onclick="openModal('privacy')" id="linkPrivacy">Приватность</span>
        </div>
        <p style="margin-top: 15px; color: #666;">
            <span id="supportText">Поддержка</span>: <a href="https://t.me/arsvat2" style="color: #fff; text-decoration: none;">@arsvat2</a>
        </p>
    </footer>

    <div id="oferta" class="modal"><div class="modal-content glass" style="padding: 30px;"><span class="close-btn" onclick="closeModal('oferta')">&times;</span><div id="ofertaContent"></div></div></div>
    <div id="privacy" class="modal"><div class="modal-content glass" style="padding: 30px;"><span class="close-btn" onclick="closeModal('privacy')">&times;</span><div id="privacyContent"></div></div></div>

    <script>
        let currentLang = 'ru';

        const translations = {
            ru: {
                btn: 'EN',
                tagline: 'Твой портал в свободный интернет',
                featLocTitle: 'Европа и Азия',
                featLocSub: 'Локации серверов',
                featSpeedTitle: 'до 1 Гбит/с',
                featSpeedSub: 'Скорость соединения',
                plan1: '1 Месяц',
                plan2: '3 Месяца',
                plan3: '1 Год',
                linkOferta: 'Оферта',
                linkPrivacy: 'Приватность',
                supportText: 'Поддержка',
                ofertaText: '<h2>Оферта</h2><p>Много информации о правилах использования Cosmos VPN в Европе и Азии...</p>',
                privacyText: '<h2>Приватность</h2><p>Мы не храним логи. Ваша скорость и данные под защитой...</p>'
            },
            en: {
                btn: 'RU',
                tagline: 'Your portal to the free internet',
                featLocTitle: 'Europe & Asia',
                featLocSub: 'Server locations',
                featSpeedTitle: 'up to 1 Gbps',
                featSpeedSub: 'Connection speed',
                plan1: '1 Month',
                plan2: '3 Months',
                plan3: '1 Year',
                linkOferta: 'Terms of Service',
                linkPrivacy: 'Privacy Policy',
                supportText: 'Support',
                ofertaText: '<h2>Terms of Service</h2><p>Extensive information about using Cosmos VPN in Europe and Asia...</p>',
                privacyText: '<h2>Privacy Policy</h2><p>No-logs policy. Your speed and data are secured...</p>'
            }
        };

        function updateContent() {
            const t = translations[currentLang];
            document.getElementById('langBtn').innerText = t.btn;
            document.getElementById('tagline').innerText = t.tagline;
            document.getElementById('featLocTitle').innerText = t.featLocTitle;
            document.getElementById('featLocSub').innerText = t.featLocSub;
            document.getElementById('featSpeedTitle').innerText = t.featSpeedTitle;
            document.getElementById('featSpeedSub').innerText = t.featSpeedSub;
            document.getElementById('plan1').innerText = t.plan1;
            document.getElementById('plan2').innerText = t.plan2;
            document.getElementById('plan3').innerText = t.plan3;
            document.getElementById('linkOferta').innerText = t.linkOferta;
            document.getElementById('linkPrivacy').innerText = t.linkPrivacy;
            document.getElementById('supportText').innerText = t.supportText;
            document.getElementById('ofertaContent').innerHTML = t.ofertaText;
            document.getElementById('privacyContent').innerHTML = t.privacyText;
        }

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            updateContent();
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Инициализация
        updateContent();
    </script>
</body>
</html>
